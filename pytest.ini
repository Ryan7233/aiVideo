[pytest]
markers =
    integration: requires local FFmpeg and performs a short media encode

# Deprecations are errors so our own code cannot quietly rot. Order matters:
# later entries win, so the specific ignores below override the blanket error.
filterwarnings =
    error::DeprecationWarning
    # audioread (via librosa) warns about the stdlib audio modules removed in
    # Python 3.13; it ships its own replacements. Third-party, unavoidable.
    ignore:aifc was removed in Python 3.13.*:DeprecationWarning
    ignore:sunau was removed in Python 3.13.*:DeprecationWarning
    ignore:chunk was removed in Python 3.13.*:DeprecationWarning
    # starlette's TestClient warns about httpx; nothing we control.
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient`.*
