version: '3.8'

services:
  # Redis服务 - 消息队列和缓存
  redis:
    image: redis:7-alpine
    container_name: ai-video-redis
    restart: unless-stopped
    ports:
      # Loopback only: this Redis has no password set.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-video-network

  # API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-video-api
    restart: unless-stopped
    ports:
      # Loopback only. Use the production profile (nginx) to expose it,
      # and set AIVIDEO_API_KEY first -- the API has no auth without it.
      - "127.0.0.1:8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JOB_BACKEND=celery
      - AIVIDEO_DB_PATH=/app/state/aivideo.db
      - AIVIDEO_API_KEY=${AIVIDEO_API_KEY:-}
    volumes:
      - ./input_data:/app/input_data
      - ./output_data:/app/output_data
      - ./logs:/app/logs
      - job_state:/app/state
      - api_cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-video-network

  # Celery Worker服务
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # No container_name: it conflicts with replicas -- Docker cannot give two
    # containers the same name, so `deploy.replicas: 2` silently yields one.
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - C_FORCE_ROOT=1
      - JOB_BACKEND=celery
      - AIVIDEO_DB_PATH=/app/state/aivideo.db
      - AIVIDEO_API_KEY=${AIVIDEO_API_KEY:-}
    volumes:
      - ./input_data:/app/input_data
      - ./output_data:/app/output_data
      - ./logs:/app/logs
      - ./models:/app/models  # Whisper模型缓存
      - job_state:/app/state
      - worker_cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "worker.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-video-network
    deploy:
      replicas: 2  # 运行2个worker实例
      resources:
        limits:
          memory: 4G  # Whisper需要更多内存
    # MAX_CONCURRENT_MEDIA_JOBS is a per-process semaphore, so the real cap on
    # concurrent FFmpeg processes is replicas x concurrency x that value.
    # Size it against the host, not against one container.

  # Flower监控服务
  flower:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-video-flower
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: celery -A worker.celery_app flower --basic-auth=${FLOWER_BASIC_AUTH:-admin:change-me}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-video-network
    profiles:
      - observability

  # MinIO对象存储服务 (可选)
  minio:
    image: minio/minio:latest
    container_name: ai-video-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-before-use}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-video-network
    profiles:
      - storage

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: ai-video-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./output_data:/var/www/static:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-video-network
    profiles:
      - production  # 仅在生产环境启用

  # Prometheus监控 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-video-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-video-network
    profiles:
      - monitoring  # 仅在启用监控时启用

  # Grafana仪表板 (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: ai-video-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me-before-use}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-video-network
    profiles:
      - monitoring  # 仅在启用监控时启用

# 网络配置
networks:
  ai-video-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  job_state:
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  api_cache:
    driver: local
  worker_cache:
    driver: local
  whisper_models:
    driver: local  # Whisper模型缓存
