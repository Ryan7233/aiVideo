# Reverse proxy for the API.
#
# The previous version tried to route path by path: it proxied five prefixes,
# aliased /static/ at output_data (the frontend's CSS and JS live inside the
# app, so they 404'd), redirected / to /api/, and left /jobs, /upload,
# /cover, /xiaohongshu and the rest unproxied. The app owns every path it
# serves, including its own static files, so there is one upstream and one
# rule.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log;

    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 1G;   # video uploads

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript image/svg+xml;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Clipping and ASR run for minutes even behind the job API, and an
        # upload of a large file takes a while to stream through.
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Terminating TLS here is the intended place to add authentication:
        # set AIVIDEO_API_KEY on the api service and inject it, so the
        # application is never reachable unauthenticated.
        #
        #     proxy_set_header X-API-Key "your-key";

        location / {
            proxy_pass http://api_backend;
        }
    }

    # HTTPS. Disabled by default because no certificate ships with the repo;
    # the old config referenced /etc/nginx/ssl/cert.pem and an
    # api-locations.conf that do not exist, so `nginx -t` failed and the
    # production profile could not start. Mount certs into ./nginx/ssl and
    # uncomment.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.example;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     client_max_body_size 1G;
    #     proxy_read_timeout 1800s;
    #     proxy_send_timeout 1800s;
    #
    #     location / {
    #         proxy_pass http://api_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
}
