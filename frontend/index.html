<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiVideo — 长视频剪辑清单</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>aiVideo</h1>
    <p>把一段长视频压成一份剪辑清单：哪几段值得剪，为什么，时间码多少。</p>
    <div class="auth hidden" id="auth">
      <label for="api-key">这个服务需要 API Key</label>
      <input type="password" id="api-key" placeholder="AIVIDEO_API_KEY" autocomplete="off">
      <button id="api-key-save" type="button">保存</button>
      <span class="auth-note" id="auth-note">存在本浏览器，随请求发送</span>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="panel">
    <h2>1 · 素材</h2>

    <div class="tabs" role="tablist">
      <button class="tab active" data-source="file" role="tab" aria-selected="true">上传文件</button>
      <button class="tab" data-source="url" role="tab" aria-selected="false">平台链接</button>
    </div>

    <div class="source" id="source-file">
      <label class="drop" for="video-input" id="drop">
        <strong id="drop-title">选择或拖入视频</strong>
        <span id="drop-hint">mp4 / mov / mkv / avi</span>
        <input type="file" id="video-input" accept="video/*" hidden>
      </label>
    </div>

    <div class="source hidden" id="source-url">
      <input type="url" id="video-url" placeholder="https://www.bilibili.com/video/… 或直链 .mp4">
      <p class="hint">平台链接经 yt-dlp 解析；直链走带大小上限的下载器。仅限公网地址。</p>
    </div>
  </section>

  <section class="panel">
    <h2>2 · 怎么选</h2>

    <div class="grid">
      <label class="field">
        <span>选段模式</span>
        <select id="selection-mode">
          <option value="highlights" selected>精彩片段 · 优先选高分内容</option>
          <option value="summary">结构化摘要 · 优先覆盖开场和结尾</option>
        </select>
        <small>摘要模式也会跳过低分首尾；沿语句边界切分，实际段数可能少于目标</small>
      </label>
      <label class="field">
        <span>主题</span>
        <input type="text" id="topic" placeholder="例如：小红书运营">
        <small>用来判断片段是否切题</small>
      </label>

      <label class="field">
        <span>片段数</span>
        <input type="number" id="segments" value="3" min="1" max="10">
      </label>

      <label class="field">
        <span>总时长（秒）</span>
        <input type="number" id="duration" value="60" min="5" max="300">
      </label>

      <label class="field">
        <span>ASR 模型</span>
        <select id="asr-model">
          <option value="tiny">tiny · 最快</option>
          <option value="base" selected>base · 均衡</option>
          <option value="small">small · 更准</option>
        </select>
      </label>
    </div>

    <div class="weights">
      <span class="weights-label">权重</span>
      <label class="weight"><span>语义 <b id="w-sem-v">0.5</b></span>
        <input type="range" id="w-sem" min="0" max="1" step="0.1" value="0.5"></label>
      <label class="weight"><span>画面 <b id="w-vis-v">0.2</b></span>
        <input type="range" id="w-vis" min="0" max="1" step="0.1" value="0.2"></label>
      <label class="weight"><span>音频 <b id="w-aud-v">0.3</b></span>
        <input type="range" id="w-aud" min="0" max="1" step="0.1" value="0.3"></label>
    </div>

    <div class="toggles">
      <label class="check"><input type="checkbox" id="use-asr" checked> 语音识别（关掉则只按画面和音频选）</label>
      <label class="check"><input type="checkbox" id="render"> 同时渲染 9:16 成片<small>清单几秒出，成片要等转码</small></label>
    </div>
  </section>

  <div class="actions">
    <button id="run" class="primary">生成剪辑清单</button>
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </div>

  <section class="panel result hidden" id="result">
    <h2>3 · 清单</h2>
    <div class="summary" id="summary"></div>
    <div class="scroll">
      <table id="clips">
        <thead><tr>
          <th>#</th><th>起</th><th>止</th><th>时长</th>
          <th>总分</th><th>语义</th><th>画面</th><th>音频</th><th>理由 / 内容</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="downloads" id="downloads"></div>
    <video id="preview" class="hidden" controls playsinline></video>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
